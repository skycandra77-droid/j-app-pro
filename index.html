<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaundryPOS</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --bg:#f0ede8;--surface:#faf8f5;--border:#ddd8cf;
  --accent:#2e7d6b;--accent2:#e8f5f1;--accent3:#1a5c4e;
  --danger:#c0392b;--danger-bg:#fdf2f0;
  --warn:#d97706;--warn-bg:#fffbeb;
  --blue:#1d6fa4;--blue-bg:#e8f2fb;
  --purple:#7c3aed;--purple-bg:#f5f3ff;
  --text:#1c1a17;--text2:#6b6355;--text3:#9d9185;
  --shadow:0 2px 12px rgba(0,0,0,.08);--shadow-lg:0 8px 32px rgba(0,0,0,.14);
  --radius:14px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
header{background:var(--accent);color:white;padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 16px rgba(46,125,107,.3);position:sticky;top:0;z-index:100}
.logo{font-family:'DM Serif Display',serif;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;gap:8px}
.logo-img{width:32px;height:32px;border-radius:50%;background:white;object-fit:cover}
.logo span{font-style:italic;opacity:.7;font-size:.85rem;margin-left:4px}
.nav-tabs{display:flex;gap:2px;background:rgba(255,255,255,.15);border-radius:10px;padding:3px}
.nav-tab{padding:5px 12px;border-radius:7px;cursor:pointer;font-weight:700;font-size:.78rem;color:rgba(255,255,255,.7);border:none;background:none;transition:all .2s;white-space:nowrap}
.nav-tab.active{background:white;color:var(--accent)}
.page{display:none}
.page.active{display:flex}
.manual-weight-input{width:100%;padding:8px;border:2px dashed var(--blue);border-radius:var(--radius-sm);background:var(--blue-bg);color:var(--blue);font-family:'DM Mono',monospace;font-size:.9rem;margin-top:4px}
.manual-weight-input:focus{border-color:var(--blue);outline:none}
.addon-item{background:var(--bg);border-radius:var(--radius-sm);padding:8px;border:1.5px solid var(--border);margin:6px 0;display:flex;justify-content:space-between;align-items:center}
.addon-name{font-size:.8rem;font-weight:700}
.addon-price{font-family:'DM Mono',monospace;color:var(--accent);font-size:.75rem}
.addon-remove{cursor:pointer;color:var(--danger);font-size:.9rem}
.logo-upload{margin-bottom:12px}
.logo-upload-area{border:2px dashed var(--accent);border-radius:var(--radius-sm);padding:16px;text-align:center;cursor:pointer;transition:all .2s}
.logo-upload-area:hover{background:var(--accent2)}
.logo-preview{width:80px;height:80px;border-radius:50%;object-fit:cover;margin-bottom:10px;border:2px solid var(--accent)}
.pc-addons{font-size:.72rem;color:var(--text2);margin-top:6px;padding:6px;background:var(--bg);border-radius:var(--radius-sm)}
.pc-addons strong{color:var(--accent)}
#page-kasir{flex-direction:column;height:calc(100vh - 56px);overflow:hidden}
.kasir-inner{display:flex;flex:1;overflow:hidden;min-height:0}
.product-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:12px 12px 12px 14px;gap:10px;min-width:0}
.search-input{width:100%;padding:8px 13px;border:2px solid var(--border);border-radius:var(--radius-sm);font-family:'Nunito',sans-serif;font-size:.88rem;background:var(--surface);outline:none;transition:border .2s}
.search-input:focus{border-color:var(--accent)}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px;overflow-y:auto;align-content:start}
.product-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .15s;position:relative;overflow:hidden;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.product-card:hover{border-color:var(--accent);box-shadow:0 2px 12px rgba(0,0,0,.08);transform:translateY(-2px)}
.p-icon{font-size:1.5rem}
.p-name{font-size:.7rem;font-weight:700;line-height:1.2;color:var(--text)}
.p-price{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--accent);margin-top:1px}
.cart-panel{width:310px;min-width:290px;background:var(--surface);border-left:2px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.cart-header{padding:12px 14px 10px;border-bottom:2px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.cart-title{font-family:'DM Serif Display',serif;font-size:1.05rem}
.customer-section{padding:9px 14px;border-bottom:2px solid var(--border);display:flex;flex-direction:column;gap:6px}
.customer-section label{font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--text3)}
.customer-section input{padding:6px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:'Nunito',sans-serif;font-size:.83rem;background:var(--bg);outline:none;transition:border .2s}
.customer-section input:focus{border-color:var(--accent)}
.cart-items{flex:1;overflow-y:auto;padding:9px 11px;display:flex;flex-direction:column;gap:6px}
.cart-empty{text-align:center;color:var(--text3);padding:28px 14px;font-size:.83rem}
.cart-item{background:var(--bg);border-radius:var(--radius-sm);padding:8px 9px;display:flex;align-items:center;gap:7px;border:1.5px solid var(--border);animation:slideIn .15s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:translateX(0)}}
.ci-icon{font-size:1.1rem;flex-shrink:0}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:.78rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-price{font-family:'DM Mono',monospace;font-size:.73rem;color:var(--accent)}
.ci-weight{font-size:.68rem;color:var(--blue);font-weight:700;background:var(--blue-bg);border-radius:4px;padding:1px 5px;margin-top:1px;display:inline-block}
.qty-ctrl{display:flex;align-items:center;gap:4px;flex-shrink:0}
.qty-btn{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;transition:all .1s}
.qty-num{font-family:'DM Mono',monospace;font-size:.8rem;min-width:16px;text-align:center}
.ci-del{color:var(--text3);cursor:pointer;font-size:.85rem;background:none;border:none;padding:2px;transition:color .1s}
.ci-del:hover{color:var(--danger)}
.cart-footer{border-top:2px solid var(--border);padding:10px 14px;display:flex;flex-direction:column;gap:7px}
.sum-row{display:flex;justify-content:space-between;font-size:.82rem;color:var(--text2)}
.sum-row.total{font-size:.98rem;font-weight:800;color:var(--text);padding-top:6px;border-top:1.5px dashed var(--border)}
.sum-row .mono{font-family:'DM Mono',monospace}
.disc-row{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--text2)}
.disc-row input{width:56px;padding:3px 6px;border:1.5px solid var(--border);border-radius:6px;font-family:'DM Mono',monospace;font-size:.78rem;outline:none;background:var(--bg);text-align:right}
.btn-row{display:flex;gap:6px}
.bayar-btn{flex:1;background:var(--accent);color:white;border:none;border-radius:var(--radius);padding:11px 7px;font-family:'Nunito',sans-serif;font-size:.88rem;font-weight:800;cursor:pointer;transition:all .2s}
.bayar-btn:hover{background:var(--accent3);transform:translateY(-1px)}
.bayar-btn:disabled{background:var(--border);cursor:not-allowed;color:var(--text3)}
.pending-btn{background:var(--blue-bg);color:var(--blue);border:2px solid #93c5fd;border-radius:var(--radius);padding:11px 7px;font-family:'Nunito',sans-serif;font-size:.8rem;font-weight:800;cursor:pointer;transition:all .2s}
.pending-btn:hover{background:#dbeafe}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border-radius:20px;padding:22px;width:370px;max-width:95vw;max-height:90vh;overflow-y:auto;transform:scale(.95);transition:transform .2s;box-shadow:0 8px 32px rgba(0,0,0,.14)}
.modal-overlay.open .modal{transform:scale(1)}
.modal-title{font-family:'DM Serif Display',serif;font-size:1.2rem;margin-bottom:16px;text-align:center}
.modal-actions{display:flex;gap:7px}
.btn-cancel{flex:1;padding:10px;border-radius:var(--radius);border:2px solid var(--border);background:none;font-family:'Nunito',sans-serif;font-weight:700;cursor:pointer;color:var(--text2);transition:all .15s}
.btn-cancel:hover{background:var(--bg)}
.btn-confirm{flex:2;padding:10px;border-radius:var(--radius);border:none;background:var(--accent);color:white;font-family:'Nunito',sans-serif;font-weight:800;font-size:.9rem;cursor:pointer;transition:all .15s}
.btn-confirm:hover{background:var(--accent3)}
.btn-confirm.blue{background:var(--blue)}
.btn-confirm.blue:hover{background:#155e8a}
.pending-form{background:var(--blue-bg);border:2px solid #93c5fd;border-radius:var(--radius-sm);padding:13px;margin-bottom:13px;display:flex;flex-direction:column;gap:9px}
.pending-form label{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--blue);display:block}
.pending-form input{width:100%;padding:7px 10px;border:1.5px solid #93c5fd;border-radius:var(--radius-sm);font-family:'Nunito',sans-serif;font-size:.83rem;background:white;outline:none}
.pending-form input:focus{border-color:var(--blue)}
.addon-input-group{display:flex;gap:6px;margin-bottom:10px}
.addon-input-group input{flex:1;padding:7px 10px;border:1.5px solid #93c5fd;border-radius:var(--radius-sm);font-family:'Nunito',sans-serif;font-size:.83rem;background:white}
.addon-input-group button{padding:7px 12px;background:var(--accent);color:white;border:none;border-radius:var(--radius-sm);cursor:pointer;font-weight:700;font-size:.8rem}
#page-pengaturan{flex-direction:column;overflow-y:auto}
.set-inner{padding:18px 22px;display:flex;flex-direction:column;gap:20px;max-width:700px;width:100%;margin:0 auto}
.set-section{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.set-section-title{font-family:'DM Serif Display',serif;font-size:1.05rem;margin-bottom:2px}
.set-field{display:flex;flex-direction:column;gap:5px}
.set-field label{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--text3)}
.set-field input{padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:'Nunito',sans-serif;font-size:.88rem;background:var(--bg);outline:none;transition:border .2s}
.set-field input:focus{border-color:var(--accent)}
.set-save-btn{background:var(--accent);color:white;border:none;border-radius:var(--radius);padding:10px 20px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.9rem;cursor:pointer;transition:all .15s}
.set-save-btn:hover{background:var(--accent3)}
.pending-card{background:var(--surface);border:2px solid #93c5fd;border-radius:var(--radius);overflow:hidden;margin-bottom:10px}
.pending-card-header{background:var(--blue-bg);padding:9px 13px;display:flex;justify-content:space-between;align-items:center}
.pc-name{font-weight:800;font-size:.88rem;color:var(--blue)}
.pc-total{font-family:'DM Mono',monospace;font-size:.95rem;font-weight:700;color:var(--blue)}
@media(max-width:680px){
  #page-kasir .kasir-inner{flex-direction:column}
  .cart-panel{width:100%;min-width:unset;border-left:none;border-top:2px solid var(--border);max-height:52vh}
  .product-panel{max-height:44vh}
}
</style>
</head>
<body>

<header>
  <div class="logo" id="logoText">
    <img id="logoImg" class="logo-img" style="display:none;">
    <span>LaundryPOS <span style="font-style:italic;opacity:.7;font-size:.85rem">kasir digital</span></span>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showPage('kasir')">🧾 Kasir</button>
    <button class="nav-tab" onclick="showPage('laporan')">📊 Laporan</button>
    <button class="nav-tab" onclick="showPage('pengaturan')">⚙️</button>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <button class="logout-btn" onclick="doLogout()" style="background:rgba(255,255,255,.15);border:none;color:white;border-radius:8px;padding:5px 10px;cursor:pointer">Keluar</button>
  </div>
</header>

<div id="page-kasir" class="page active">
  <div class="kasir-inner">
    <div class="product-panel">
      <input class="search-input" id="searchInput" type="text" placeholder="🔍 Cari layanan..." oninput="renderProducts()">
      <div id="productGrid"></div>
    </div>
    <div class="cart-panel">
      <div class="cart-header">
        <div class="cart-title">🛒 Pesanan</div>
      </div>
      <div class="customer-section">
        <label>Nama Pelanggan</label>
        <input type="text" id="custName" placeholder="Wajib untuk pending...">
        <label>No. HP</label>
        <input type="text" id="custPhone" placeholder="Opsional...">
      </div>
      <div class="cart-items" id="cartItems">
        <div class="cart-empty"><div style="font-size:2rem;margin-bottom:6px">🧺</div>Belum ada item</div>
      </div>
      <div class="cart-footer">
        <div class="sum-row"><span>Total</span><span class="mono" id="totalVal">Rp 0</span></div>
        <div class="btn-row">
          <button class="pending-btn" id="pendingBtn" onclick="openPending()" disabled>🕐 Pending</button>
          <button class="bayar-btn" id="bayarBtn" onclick="openBayar()" disabled>Bayar →</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="page-laporan" class="page" style="flex-direction:column;overflow-y:auto;padding:20px">
  <h2>📊 Laporan Pending</h2>
  <div id="pendingList" style="margin-top:20px"></div>
</div>

<div id="page-pengaturan" class="page">
  <div class="set-inner">
    <div style="font-family:'DM Serif Display',serif;font-size:1.4rem">⚙️ Pengaturan</div>
    
    <div class="set-section">
      <div class="set-section-title">🏪 Informasi Toko</div>
      <div class="set-field">
        <label>Nama Toko</label>
        <input type="text" id="set-nama-toko" placeholder="Laundry Bersih Jaya...">
      </div>
      <div class="set-field">
        <label>Tagline</label>
        <input type="text" id="set-tagline" placeholder="kasir digital">
      </div>
    </div>

    <div class="set-section">
      <div class="set-section-title">🖼️ Logo Toko (Base64)</div>
      <div class="logo-upload">
        <div class="logo-upload-area" onclick="document.getElementById('logoFileInput').click()">
          <div id="logoPreviewArea">
            <div style="font-size:2rem;margin-bottom:8px">📸</div>
            <div style="font-size:.85rem;font-weight:700">Tap untuk upload logo</div>
            <small style="font-size:.72rem;opacity:.7">PNG/JPG (Max 500KB)</small>
          </div>
          <img id="logoPreviewImg" class="logo-preview" style="display:none;">
        </div>
        <input type="file" id="logoFileInput" accept="image/*" style="display:none" onchange="handleLogoUpload(event)">
        <button class="set-save-btn" style="margin-top:10px" onclick="saveLogo()">💾 Simpan Logo</button>
      </div>
    </div>

    <div class="set-section">
      <div class="set-section-title">🧺 Edit Layanan & Harga</div>
      <div id="serviceList" style="display:flex;flex-direction:column;gap:8px"></div>
      <button class="set-save-btn" onclick="saveServices()" style="margin-top:10px">💾 Simpan Layanan</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script>
const defaultServices = [
  {id:1,name:'Cuci Reguler',icon:'👕',price:7000,unit:'per kg',perKg:true},
  {id:2,name:'Cuci Express',icon:'⚡',price:12000,unit:'per kg',perKg:true},
  {id:3,name:'Setrika',icon:'🔥',price:5000,unit:'per kg',perKg:true},
  {id:4,name:'Cuci Sepatu',icon:'👟',price:30000,unit:'per pasang',perKg:false},
  {id:5,name:'Dry Clean',icon:'👔',price:50000,unit:'per item',perKg:false},
];

let products = JSON.parse(localStorage.getItem('lpos_services') || 'null') || defaultServices;
let tokoConfig = JSON.parse(localStorage.getItem('lpos_toko') || '{"nama":"LaundryPOS","tagline":"kasir digital","logo":""}');
let cart = [];
let pendings = JSON.parse(localStorage.getItem('lpos_pending') || '[]');

const fmt = n => 'Rp ' + Math.round(n).toLocaleString('id-ID');

function applyTokoConfig() {
  document.title = tokoConfig.nama || 'LaundryPOS';
  if(tokoConfig.logo) {
    document.getElementById('logoImg').src = tokoConfig.logo;
    document.getElementById('logoImg').style.display = 'block';
  }
}

function showPage(p) {
  document.querySelectorAll('.page').forEach(x => x.style.display = 'none');
  document.getElementById('page-' + p).style.display = 'flex';
  if(p === 'laporan') renderPending();
  if(p === 'pengaturan') renderPengaturan();
  if(p === 'kasir') renderProducts();
}

function renderProducts() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = products.filter(p => p.name.toLowerCase().includes(q));
  const el = document.getElementById('productGrid');
  el.innerHTML = filtered.map(p => `
    <div class="product-card" onclick="addToCart(${p.id})">
      <div class="p-icon">${p.icon}</div>
      <div class="p-name">${p.name}</div>
      <div class="p-price">${fmt(p.price)}</div>
    </div>
  `).join('');
}

function addToCart(id) {
  const p = products.find(x => x.id === id);
  const ex = cart.find(c => c.id === id);
  if(ex) ex.qty++;
  else cart.push({...p, qty: 1, weight: null, addons: []});
  renderCart();
  renderProducts();
}

function changeQty(id, d) {
  const i = cart.findIndex(c => c.id === id);
  if(i < 0) return;
  cart[i].qty += d;
  if(cart[i].qty <= 0) cart.splice(i, 1);
  renderCart();
  renderProducts();
}

function removeItem(id) {
  cart = cart.filter(c => c.id !== id);
  renderCart();
  renderProducts();
}

function getTotal() {
  return cart.reduce((s, c) => {
    let price = c.price * (c.perKg && c.weight ? c.weight : c.qty);
    if(c.addons && c.addons.length) {
      price += c.addons.reduce((a, b) => a + b.price, 0);
    }
    return s + price;
  }, 0);
}

function renderCart() {
  const el = document.getElementById('cartItems');
  if(!cart.length) {
    el.innerHTML = '<div class="cart-empty"><div style="font-size:2rem">🧺</div>Belum ada item</div>';
    document.getElementById('bayarBtn').disabled = true;
    document.getElementById('pendingBtn').disabled = true;
    document.getElementById('totalVal').textContent = 'Rp 0';
    return;
  }
  
  el.innerHTML = cart.map(c => {
    const price = c.perKg && c.weight ? c.price * c.weight : c.price * c.qty;
    const addonTotal = c.addons && c.addons.length ? c.addons.reduce((a, b) => a + b.price, 0) : 0;
    const total = price + addonTotal;
    return `<div class="cart-item">
      <div class="ci-icon">${c.icon}</div>
      <div class="ci-info" style="flex:1">
        <div class="ci-name">${c.name}</div>
        <div class="ci-price">${fmt(total)}</div>
        ${c.perKg ? `<input type="text" class="manual-weight-input" placeholder="Berat (kg)" value="${c.weight || ''}" onchange="setWeight(${c.id}, this.value)">` : ''}
        ${c.addons && c.addons.length ? `<div class="addon-item">${c.addons.map(a => a.name).join(', ')}</div>` : ''}
      </div>
      <div class="qty-ctrl">
        <button class="qty-btn" onclick="changeQty(${c.id}, -1)">−</button>
        <span class="qty-num">${c.qty}</span>
        <button class="qty-btn" onclick="changeQty(${c.id}, 1)">+</button>
      </div>
      <button class="ci-del" onclick="removeItem(${c.id})">✕</button>
    </div>`;
  }).join('');
  
  document.getElementById('totalVal').textContent = fmt(getTotal());
  document.getElementById('bayarBtn').disabled = false;
  document.getElementById('pendingBtn').disabled = false;
}

function setWeight(id, val) {
  const item = cart.find(c => c.id === id);
  if(item) {
    item.weight = parseFloat(val.replace(',', '.')) || null;
    renderCart();
  }
}

function openPending() {
  const custName = document.getElementById('custName').value;
  if(!custName) {
    alert('Nama pelanggan harus diisi!');
    return;
  }
  
  let html = `<div class="modal-title">🕐 Simpan Pending</div>
    <div class="pending-form">
      <div><label>📅 Tanggal Masuk</label><input type="date" id="tglMasuk" value="${new Date().toISOString().split('T')[0]}"></div>
      <div><label>✅ Estimasi Selesai</label><input type="date" id="tglEst"></div>
      <div><label>📝 Catatan</label><input type="text" id="pendingNote" placeholder="Misal: express, antar rumah..."></div>
      <div><label>➕ Tambah Add-on</label>
        <div class="addon-input-group">
          <input type="text" id="addonName" placeholder="Nama add-on (sprei, selimut...)">
          <input type="number" id="addonPrice" placeholder="Harga" style="width:100px">
          <button onclick="addAddonToPending()">Tambah</button>
        </div>
        <div id="pendingAddons"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Batal</button>
      <button class="btn-confirm blue" onclick="savePending()">Simpan</button>
    </div>`;
  
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
}

function addAddonToPending() {
  const name = document.getElementById('addonName').value;
  const price = parseFloat(document.getElementById('addonPrice').value || 0);
  if(!name || price <= 0) return alert('Isi nama dan harga add-on');
  
  if(!window.pendingAddons) window.pendingAddons = [];
  window.pendingAddons.push({name, price});
  
  document.getElementById('addonName').value = '';
  document.getElementById('addonPrice').value = '';
  renderPendingAddons();
}

function renderPendingAddons() {
  const el = document.getElementById('pendingAddons');
  el.innerHTML = (window.pendingAddons || []).map((a, i) => `
    <div class="addon-item">
      <span><span class="addon-name">${a.name}</span> - <span class="addon-price">${fmt(a.price)}</span></span>
      <span class="addon-remove" onclick="removePendingAddon(${i})">✕</span>
    </div>
  `).join('');
}

function removePendingAddon(i) {
  window.pendingAddons.splice(i, 1);
  renderPendingAddons();
}

function savePending() {
  const custName = document.getElementById('custName').value;
  const custPhone = document.getElementById('custPhone').value;
  const tglMasuk = document.getElementById('tglMasuk').value;
  const tglEst = document.getElementById('tglEst').value;
  const note = document.getElementById('pendingNote').value;
  
  const items = cart.map(c => ({
    name: c.name,
    qty: c.qty,
    weight: c.weight,
    addons: c.addons || []
  }));
  
  const pending = {
    id: Date.now(),
    customer: custName,
    phone: custPhone,
    tglMasuk,
    tglEst,
    note,
    items,
    addons: window.pendingAddons || [],
    total: getTotal(),
    done: false
  };
  
  pendings.push(pending);
  localStorage.setItem('lpos_pending', JSON.stringify(pendings));
  
  cart = [];
  window.pendingAddons = [];
  document.getElementById('custName').value = '';
  document.getElementById('custPhone').value = '';
  renderCart();
  closeModal();
  alert('✓ Pending berhasil disimpan!');
}

function openBayar() {
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-title">💳 Pembayaran</div>
    <div style="background:var(--bg);border-radius:var(--radius-sm);padding:11px 13px;margin-bottom:13px">
      <div style="display:flex;justify-content:space-between;font-size:.85rem"><span>Total</span><span class="mono">${fmt(getTotal())}</span></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Batal</button>
      <button class="btn-confirm" onclick="saveTransaction()">✓ Konfirmasi Bayar</button>
    </div>`;
  document.getElementById('modalOverlay').classList.add('open');
}

function saveTransaction() {
  const custName = document.getElementById('custName').value;
  const tx = {
    id: Date.now(),
    customer: custName,
    items: cart,
    total: getTotal(),
    date: new Date().toLocaleString('id-ID'),
    method: 'tunai'
  };
  
  let txList = JSON.parse(localStorage.getItem('lpos_tx') || '[]');
  txList.push(tx);
  localStorage.setItem('lpos_tx', JSON.stringify(txList));
  
  cart = [];
  document.getElementById('custName').value = '';
  document.getElementById('custPhone').value = '';
  renderCart();
  closeModal();
  alert('✓ Transaksi berhasil disimpan!');
}

function renderPending() {
  const el = document.getElementById('pendingList');
  if(!pendings.length) {
    el.innerHTML = '<p style="text-align:center;color:var(--text3)">Tidak ada order pending</p>';
    return;
  }
  
  el.innerHTML = pendings.filter(p => !p.done).map(p => `
    <div class="pending-card">
      <div class="pending-card-header">
        <div>
          <div class="pc-name">${p.customer}</div>
          <small style="color:var(--text3)">${p.phone || '-'}</small>
        </div>
        <div class="pc-total">${fmt(p.total)}</div>
      </div>
      <div style="padding:11px 13px">
        <div style="font-size:.76rem;color:var(--text2);margin-bottom:8px">
          📅 Masuk: ${p.tglMasuk} | ✅ Selesai: ${p.tglEst}
        </div>
        <div style="font-size:.75rem;background:var(--bg);padding:6px;border-radius:var(--radius-sm);margin-bottom:8px">
          ${p.items.map(i => i.name + (i.weight ? ' (' + i.weight + 'kg)' : ' x' + i.qty)).join(', ')}
        </div>
        ${p.addons && p.addons.length ? `
          <div class="pc-addons">
            <strong>Add-on:</strong> ${p.addons.map(a => a.name + ' (' + fmt(a.price) + ')').join(', ')}
          </div>
        ` : ''}
        ${p.note ? `<div style="font-size:.72rem;color:var(--text3);font-style:italic">📝 ${p.note}</div>` : ''}
        <button class="set-save-btn" style="width:100%;margin-top:8px" onclick="markDone(${p.id})">✓ Selesai</button>
      </div>
    </div>
  `).join('');
}

function markDone(id) {
  const p = pendings.find(x => x.id === id);
  if(p) p.done = true;
  localStorage.setItem('lpos_pending', JSON.stringify(pendings));
  renderPending();
}

function handleLogoUpload(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const b64 = ev.target.result;
    document.getElementById('logoPreviewImg').src = b64;
    document.getElementById('logoPreviewImg').style.display = 'block';
    document.getElementById('logoPreviewArea').style.display = 'none';
    window.logoBase64 = b64;
  };
  reader.readAsDataURL(file);
}

function saveLogo() {
  if(!window.logoBase64) return alert('Pilih gambar terlebih dahulu');
  tokoConfig.logo = window.logoBase64;
  localStorage.setItem('lpos_toko', JSON.stringify(tokoConfig));
  applyTokoConfig();
  alert('✓ Logo berhasil disimpan!');
}

function renderPengaturan() {
  document.getElementById('set-nama-toko').value = tokoConfig.nama || '';
  document.getElementById('set-tagline').value = tokoConfig.tagline || '';
  
  const el = document.getElementById('serviceList');
  el.innerHTML = products.map(p => `
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:center">
      <input type="text" value="${p.name}" onchange="updateService(${p.id}, 'name', this.value)" style="padding:6px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:.83rem">
      <input type="number" value="${p.price}" onchange="updateService(${p.id}, 'price', this.value)" style="padding:6px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:.83rem">
      <button onclick="deleteService(${p.id})" style="padding:6px;background:var(--danger);color:white;border:none;border-radius:var(--radius-sm);cursor:pointer">Hapus</button>
    </div>
  `).join('');
}

function updateService(id, field, val) {
  const p = products.find(x => x.id === id);
  if(p) p[field] = field === 'price' ? parseFloat(val) : val;
}

function deleteService(id) {
  products = products.filter(p => p.id !== id);
  renderPengaturan();
}

function saveServices() {
  localStorage.setItem('lpos_services', JSON.stringify(products));
  alert('✓ Layanan berhasil disimpan!');
}

function saveTokoInfo() {
  tokoConfig.nama = document.getElementById('set-nama-toko').value;
  tokoConfig.tagline = document.getElementById('set-tagline').value;
  localStorage.setItem('lpos_toko', JSON.stringify(tokoConfig));
  applyTokoConfig();
  alert('✓ Info toko berhasil disimpan!');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function doLogout() {
  if(confirm('Yakin ingin logout?')) {
    location.reload();
  }
}

document.getElementById('modalOverlay').addEventListener('click', e => {
  if(e.target.id === 'modalOverlay') closeModal();
});

applyTokoConfig();
renderProducts();
renderCart();
</script>
</body>
</html>
